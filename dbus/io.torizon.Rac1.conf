<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- Install to /usr/share/dbus-1/system.d/io.torizon.Rac1.conf -->
<busconfig>
  <!-- Only root (rac) may own the service name and call it -->
  <policy user="root">
    <allow own="io.torizon.Rac1"/>
    <allow send_destination="io.torizon.Rac1"/>
  </policy>


  <policy user="torizon">
    <allow own="io.torizon.Rac1"/>
    <allow send_destination="io.torizon.Rac1"/>
  </policy>
  
  <!-- Everyone else may only introspect -->
  <policy context="default">
    <deny send_destination="io.torizon.Rac1"/>
    <allow send_destination="io.torizon.Rac1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
